# Local backend deps for full-stack dev/testing. No AWS involved.
#   npm run db:up    -> start (DynamoDB Local + admin UI)
#   npm run db:down  -> stop
services:
  # In-memory DynamoDB. Data resets on restart (-inMemory); one shared db (-sharedDb).
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: taskly-dynamodb-local
    ports:
      - '8000:8000'
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory', '-sharedDb']

  # Web GUI to browse/edit the local data:  http://localhost:8001
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: taskly-dynamodb-admin
    ports:
      - '8001:8001'
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
