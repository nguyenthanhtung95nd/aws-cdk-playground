<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-overview-title arch-overview-desc">
      <title id="arch-overview-title">Order Pipeline architecture overview</title>
      <desc id="arch-overview-desc">Architecture diagram: the browser reaches API Gateway through CloudFront, HTTP Lambdas write and read the DynamoDB orders table, and the table stream feeds a dispatcher that queues work for a worker, plus a filtered review lane via EventBridge Pipes.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <g transform="translate(0,-136)">
      <!-- Zones (painted first) -->
      <rect x="200" y="200" width="768" height="112" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="208" y="204" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="284" y="213" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SYNCHRONOUS · REQUEST</text>

      <rect x="584" y="384" width="656" height="112" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="896" y="388" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="972" y="397" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ASYNCHRONOUS · EVENTS</text>

      <!-- Arrows (before nodes) -->
      <!-- A1 Browser -> CloudFront -->
      <line x1="168" y1="256" x2="216" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
      <!-- A2 CloudFront -> API Gateway -->
      <line x1="360" y1="256" x2="408" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
      <!-- A3 API Gateway -> HTTP Lambdas -->
      <line x1="552" y1="256" x2="600" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <!-- A4 HTTP Lambdas -> DynamoDB (primary) -->
      <line x1="744" y1="256" x2="792" y2="256" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
      <!-- A5 DynamoDB bottom -> Dispatcher top (stream) -->
      <line x1="868" y1="296" x2="868" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <!-- A6 DynamoDB bottom -> Pipe top (stream, filtered) -->
      <path d="M 816,296 V 348 Q 816,356 808,356 H 680 Q 672,356 672,364 V 416" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
      <!-- A7 Dispatcher -> SQS work -->
      <line x1="952" y1="448" x2="1000" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <!-- A8 SQS work -> Worker -->
      <line x1="1104" y1="448" x2="1136" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <!-- A9 Worker top -> DynamoDB right (status update) -->
      <path d="M 1184,416 V 280 Q 1184,272 1176,272 H 952" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

      <!-- Arrow labels (masked, 6-10px above the stroke) -->
      <rect x="172" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="245" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="364" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="245" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">/API/*</text>

      <rect x="556" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INVOKE</text>

      <rect x="748" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="245" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>

      <rect x="876" y="344" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="900" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STREAM</text>

      <rect x="696" y="336" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STREAM·FILTER</text>

      <rect x="960" y="428" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="976" y="437" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEND</text>

      <rect x="1024" y="252" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1068" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE STATUS</text>

      <!-- Node: Browser (user) -->
      <rect x="40" y="232" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="232" width="128" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="240" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="249" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="104" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="104" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React · polls</text>

      <!-- Node: CloudFront + S3 (edge) -->
      <rect x="216" y="232" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="232" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="224" y="240" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="240" y="249" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="288" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CloudFront + S3</text>
      <text x="288" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">site · strips /api</text>

      <!-- Node: API Gateway -->
      <rect x="408" y="232" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="232" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="416" y="240" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="430" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="480" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Gateway</text>
      <text x="480" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP v2 · no auth</text>

      <!-- Node: HTTP Lambdas -->
      <rect x="600" y="232" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="232" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="240" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="622" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="672" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP Lambdas</text>
      <text x="672" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">place-order · list-orders</text>

      <!-- Node: DynamoDB orders (focal) -->
      <rect x="792" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="232" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="800" y="240" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="818" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="872" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DynamoDB orders</text>
      <text x="872" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PK orderId · stream on</text>

      <!-- Node: Review lane (Pipe) - optional/async -->
      <rect x="600" y="416" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="416" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="608" y="424" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="624" y="433" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPE</text>
      <text x="672" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review lane</text>
      <text x="672" y="469" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valueTier = HIGH_VALUE</text>

      <!-- Node: Dispatcher -->
      <rect x="792" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="416" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="800" y="424" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="814" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="872" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatcher</text>
      <text x="872" y="469" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING → PROCESSING</text>

      <!-- Node: SQS work -->
      <rect x="1000" y="416" width="104" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="416" width="104" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1008" y="424" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="1022" y="433" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQS</text>
      <text x="1052" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">work</text>
      <text x="1052" y="469" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DLQ · 3 tries</text>

      <!-- Node: Worker -->
      <rect x="1136" y="416" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1136" y="416" width="96" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1144" y="424" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="1158" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="1184" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
      <text x="1184" y="469" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">settles order</text>
      </g>

      <!-- Legend strip -->
      <g transform="translate(0,-112)">
      <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="680" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Source of truth</text>

      <rect x="180" y="680" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lambda / API</text>

      <rect x="320" y="680" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="340" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Queue</text>

      <rect x="440" y="680" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="460" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Side lane (detail in review diagram)</text>

      <line x1="700" y1="686" x2="728" y2="686" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
      <text x="736" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>

      <line x1="800" y1="686" x2="828" y2="686" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
      <text x="836" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary write</text>

      <line x1="940" y1="686" x2="968" y2="686" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
      <text x="976" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Filtered / async</text>
      </g>
    </svg>