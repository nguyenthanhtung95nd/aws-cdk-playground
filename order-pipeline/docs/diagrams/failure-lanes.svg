<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="failure-lanes-title failure-lanes-desc">
      <title id="failure-lanes-title">Failure lanes</title>
      <desc id="failure-lanes-desc">Architecture diagram of the two failure lanes: work-queue messages that fail three times are redriven to work-parking where the settler marks the order FAILED, while stream records that the dispatcher or the pipe give up on land in stream-parking that only an alarm watches.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="fl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="fl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="24" y="72" width="744" height="152" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="32" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="88" y="85" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">QUEUE LANE · SQS</text>

      <rect x="24" y="280" width="800" height="208" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="32" y="284" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="293" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STREAM LANE · DYNAMODB</text>

      <!-- Arrows -->
      <!-- work -> Worker -->
      <line x1="168" y1="152" x2="216" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <!-- Worker -> work (throw: message returns) -->
      <line x1="216" y1="184" x2="168" y2="184" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fl-arrow)"/>
      <!-- work -> work-parking (SQS redrive after 3 receives) -->
      <path d="M 104,136 V 112 Q 104,104 112,104 H 468 Q 476,104 476,112 V 136" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#fl-arrow-accent)"/>
      <!-- work-parking -> Settler -->
      <line x1="552" y1="168" x2="600" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <!-- work-parking -> Alarms (dashed, watches depth) -->
      <path d="M 476,200 V 248 Q 476,256 484,256 H 712 Q 720,256 720,264 V 356" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fl-arrow)"/>
      <!-- stream -> Dispatcher -->
      <path d="M 176,380 H 200 Q 208,380 208,372 V 348 Q 208,340 216,340 H 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <!-- stream -> Pipe -->
      <path d="M 176,404 H 200 Q 208,404 208,412 V 428 Q 208,436 216,436 H 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <!-- Dispatcher -> stream-parking (OnFailure) -->
      <path d="M 360,340 H 492 Q 500,340 500,348 V 356" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <!-- Pipe -> stream-parking (DeadLetterConfig) -->
      <path d="M 360,436 H 524 Q 532,436 532,428 V 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
      <!-- stream-parking -> Alarms (arrivals) -->
      <line x1="592" y1="388" x2="640" y2="388" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fl-arrow)"/>

      <!-- Arrow labels -->
      <rect x="172" y="164" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THROW</text>

      <rect x="254" y="84" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="93" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REDRIVE ×3</text>

      <rect x="568" y="236" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="598" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OCCUPIED</text>

      <rect x="392" y="320" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ON FAILURE</text>

      <rect x="390" y="444" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY SPENT</text>

      <rect x="596" y="368" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="616" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILLED</text>

      <!-- Node: SQS work -->
      <rect x="40" y="136" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="128" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="144" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="62" y="153" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQS</text>
      <text x="104" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">work</text>
      <text x="104" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">maxReceive 3</text>

      <!-- Node: Worker -->
      <rect x="216" y="136" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="136" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="224" y="144" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="238" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="284" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
      <text x="284" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batch item failure</text>

      <!-- Node: work-parking (focal) -->
      <rect x="400" y="136" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="136" width="152" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="144" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="422" y="153" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DLQ</text>
      <text x="476" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">work-parking</text>
      <text x="476" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">has a reader</text>

      <!-- Node: Settler -->
      <rect x="600" y="136" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="136" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="144" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="622" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="676" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Settler</text>
      <text x="676" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ FAILED · TECHNICAL</text>

      <!-- Node: orders stream -->
      <rect x="40" y="360" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="360" width="136" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="368" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="66" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="108" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orders stream</text>
      <text x="108" y="413" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">two readers</text>

      <!-- Node: Dispatcher -->
      <rect x="232" y="312" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="312" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="320" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="254" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="296" y="345" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatcher</text>
      <text x="296" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry 3 · batch 10</text>

      <!-- Node: Pipe -->
      <rect x="232" y="408" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="408" width="128" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="240" y="416" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="256" y="425" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPE</text>
      <text x="296" y="441" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review pipe</text>
      <text x="296" y="455" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry 3 · batch 1</text>

      <!-- Node: stream-parking (focal) -->
      <rect x="440" y="356" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="356" width="152" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="364" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="462" y="373" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DLQ</text>
      <text x="516" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stream-parking</text>
      <text x="516" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nobody drains it</text>

      <!-- Node: Alarms -> SNS -->
      <rect x="640" y="356" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="356" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="648" y="364" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="666" y="373" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALARM</text>
      <text x="720" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CloudWatch → SNS</text>
      <text x="720" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email on any arrival</text>

      <!-- Legend -->
      <line x1="40" y1="536" x2="936" y2="536" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="574" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Parking area (DLQ)</text>

      <rect x="200" y="574" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="220" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Queue / stream</text>

      <rect x="340" y="574" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lambda</text>

      <line x1="460" y1="580" x2="488" y2="580" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#fl-arrow-accent)"/>
      <text x="496" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SQS moves it, no code</text>

      <line x1="660" y1="580" x2="688" y2="580" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fl-arrow)"/>
      <text x="696" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Signal, not data</text>
    </svg>