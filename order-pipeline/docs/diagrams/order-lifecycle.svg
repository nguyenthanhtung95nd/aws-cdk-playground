<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="order-lifecycle-title order-lifecycle-desc">
      <title id="order-lifecycle-title">Order lifecycle</title>
      <desc id="order-lifecycle-desc">Lifecycle phase map: an order moves Pending to Processing to Completed on the primary rail; the worker can retry up to three times and park the message, and the two terminal failures are a business rejection and a technical retry exhaustion.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="lc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="lc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="24" y="44" width="912" height="120" rx="8" fill="#4f5d75" fill-opacity="0.035" stroke="#2d3142" stroke-opacity="0.12"/>
      <rect x="24" y="400" width="912" height="104" rx="8" fill="#2d3142" fill-opacity="0.035" stroke="#2d3142" stroke-opacity="0.12"/>
      <text x="40" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RETRY / PARKING</text>
      <text x="40" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">TERMINAL FAILURES</text>

      <!-- Transitions (before states) -->
      <line x1="40" y1="256" x2="64" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="214" y1="256" x2="304" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="454" y1="256" x2="560" y2="256" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#lc-arrow-accent)"/>
      <line x1="349" y1="220" x2="349" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="409" y1="140" x2="409" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lc-arrow)"/>
      <line x1="454" y1="104" x2="760" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="379" y1="292" x2="379" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="835" y1="140" x2="835" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>

      <!-- Transition labels -->
      <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="28" y="238" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="44" y="247">POST</text>
        <rect x="216" y="238" width="86" height="12" rx="2" fill="#f5f5f5"/><text x="259" y="247">STREAM INSERT</text>
        <rect x="488" y="238" width="38" height="12" rx="2" fill="#f5f5f5"/><text x="507" y="247" fill="#eb6c36">OK</text>
        <rect x="292" y="172" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="316" y="181">ERROR</text>
        <rect x="418" y="172" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="440" y="181">RETRY</text>
        <rect x="572" y="84" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="607" y="93">EXHAUSTED</text>
        <rect x="388" y="346" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="423" y="355">OVER LIMIT</text>
        <rect x="770" y="272" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="798" y="281">SETTLER</text>
      </g>

      <circle cx="34" cy="256" r="6" fill="#2d3142"/>

      <!-- Primary rail -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="139" y="251" fill="#2d3142" font-size="12" font-weight="600">Pending</text><text x="139" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">written by place-order</text></g>
        <g><rect x="304" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="379" y="251" fill="#2d3142" font-size="12" font-weight="600">Processing</text><text x="379" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">dispatcher claimed it</text></g>
        <g><rect x="560" y="220" width="150" height="72" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/><circle cx="584" cy="244" r="7" fill="none" stroke="#eb6c36"/><circle cx="584" cy="244" r="4" fill="#eb6c36"/><text x="635" y="251" fill="#2d3142" font-size="12" font-weight="600">Completed</text><text x="635" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">worker finished</text></g>
      </g>

      <!-- Retry / parking band -->
      <g text-anchor="middle">
        <g><rect x="304" y="68" width="150" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="314" y="78" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/><text x="334" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">RETRY</text><text x="379" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Retrying</text><text x="379" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">work queue · attempt ≤ 3</text></g>
        <g><rect x="760" y="68" width="150" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="770" y="78" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/><text x="794" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">PARKED</text><text x="835" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Parked</text><text x="835" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">work-parking (DLQ)</text></g>
      </g>

      <!-- Terminal failures -->
      <g text-anchor="middle">
        <g><rect x="304" y="416" width="150" height="72" rx="8" fill="#2d3142" fill-opacity="0.04" stroke="#4f5d75"/><rect x="314" y="426" width="54" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/><text x="341" y="435" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="379" y="459" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Failed · business</text><text x="379" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">amount &gt; businessLimit</text></g>
        <g><rect x="760" y="416" width="150" height="72" rx="8" fill="#2d3142" fill-opacity="0.04" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="770" y="426" width="54" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/><text x="797" y="435" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="835" y="459" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Failed · technical</text><text x="835" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">retry budget spent</text></g>
      </g>
    </svg>